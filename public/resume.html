<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Browser tab title for /resume -->
    <title>Shaurya Singh — Resume</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
      }
      object,
      .fallback {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #a1a1aa;
        text-align: center;
        padding: 2rem;
      }
      .fallback a {
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <object data="/shaurya_resume_05.pdf" type="application/pdf">
      <!-- Only rendered when the browser can't display PDFs inline -->
      <div class="fallback">
        <p>Your browser can&rsquo;t display this PDF inline.</p>
        <a href="/shaurya_resume_05.pdf" download>Download the resume</a>
      </div>
    </object>
  </body>
</html>
