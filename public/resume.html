<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Browser tab title for /resume -->
    <title>Shaurya Singh — Resume</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script>
      // Mobile browsers have no PDF plugin, so <object type="application/pdf">
      // below can never render and would dead-end on the fallback. They *can*
      // render a PDF that is the top-level document though, so send them
      // straight there instead. Runs in <head> so the shell never paints.
      (function () {
        var PDF = "/shaurya_resume_05.pdf";
        var GUARD = "resume:redirected";

        // pdfViewerEnabled is the modern signal (Chrome 94+, FF 99+, Safari
        // 16.4+); older engines only expose the mimeTypes registry.
        var canEmbedPdf =
          typeof navigator.pdfViewerEnabled === "boolean"
            ? navigator.pdfViewerEnabled
            : !!(navigator.mimeTypes && navigator.mimeTypes["application/pdf"]);

        if (canEmbedPdf) return;

        // Redirect once per tab. Without this, backing out of the PDF lands on
        // /resume and immediately bounces forward again — a back-button trap.
        try {
          if (sessionStorage.getItem(GUARD)) return;
          sessionStorage.setItem(GUARD, "1");
        } catch (e) {
          // Storage blocked (private mode / third-party context): the fallback
          // below is still a usable page, so skip the redirect entirely.
          return;
        }

        location.replace(PDF);
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #09090b;
      }
      object,
      .fallback {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #a1a1aa;
        text-align: center;
        padding: 2rem;
      }
      .fallback p {
        margin: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: #fafafa;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .actions a:hover {
        background: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <object data="/shaurya_resume_05.pdf" type="application/pdf">
      <!-- Only rendered when the browser can't display PDFs inline -->
      <div class="fallback">
        <p>This browser can&rsquo;t display the PDF inline.</p>
        <div class="actions">
          <a href="/shaurya_resume_05.pdf">Open resume</a>
          <a href="/shaurya_resume_05.pdf" download>Download</a>
        </div>
      </div>
    </object>
  </body>
</html>
